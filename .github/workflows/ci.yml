name: Kinetix L2 Native Cross-Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-native-build-and-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Native C++20, SDL2, Cairo, Pango, RSVG, and SQLite3 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev libcairo2-dev librsvg2-dev libpango1.0-dev libglib2.0-dev libsqlite3-dev python3
      - name: Build Kinetix L2 & Test Suite
        run: make all
      - name: Run Unit & Integration Tests
        run: make test
      - name: Run Headless Native GUI & SQLite3 Workflow Verification
        run: make verify
      - name: Run Native GUI Zero-Web Compliance & Project Audit
        run: make audit

  macos-native-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies via Homebrew
        run: brew install cmake pkg-config sdl2 cairo librsvg pango glib sqlite
      - name: Configure and Build via CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  windows-native-build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gdb
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-sqlite3
      - name: Build real Windows renderer
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --parallel 2
      - name: Test rendering, PNG decoding and application behavior
        run: ctest --test-dir build --output-on-failure
      - name: Diagnose native test failures
        if: failure()
        run: gdb -batch -ex run -ex "thread apply all bt" --args ./build/kinetix-tests.exe
      - name: Export real application snapshots
        run: ./build/kinetix-l2.exe --db build/verify.sqlite3 --export-screenshots build/snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-rendering-evidence
          path: |
            build/snapshots/*.png
            build/Testing/Temporary/LastTest.log
